syntax = "proto3";

package crossService;

service FileService {
  rpc ProcessFile(FileRequest) returns (FileResponse);
  rpc DecompressFile(FileRequest) returns (FileResponse);
  // Chunked streaming API for large files (avoids huge single messages).
  rpc ProcessFileStream(stream FileUploadRequest) returns (stream FileUploadResponse);
  // Streaming decompression: client streams .ccf, server streams back decompressed bytes.
  rpc DecompressFileStream(stream FileUploadRequest) returns (stream FileUploadResponse);
  // Cluster-stored mode: decompress by file ID (CCF lives on cluster, not client).
  rpc DecompressById(FileIdRequest) returns (stream FileUploadResponse);
  // Aggregate storage stats from all agents.
  rpc GetSystemStats(SystemStatsRequest) returns (SystemStatsResponse);
  // CCF store stats: optimizer status, pack savings, dictionary info.
  rpc GetCcfStoreStats(CcfStoreStatsRequest) returns (CcfStoreStatsResponse);
  // Clear all CCF store data (packs, unpacked CCFs, dictionary). Used before benchmark runs.
  rpc ClearCcfStore(ClearCcfStoreRequest) returns (ClearCcfStoreResponse);
}

message SystemStatsRequest {}

message SystemStatsResponse {
  uint64 total_unique_chunks = 1;
  uint64 total_chunk_bytes = 2;
  uint64 total_buckets = 3;
  uint64 total_vectors = 4;
  uint32 agent_count = 5;
}

// FileRequest represents the file input.
message FileRequest {
  bytes file_content = 1;
}

message FileResponse {
  bytes file_content = 1;
}

message FileMetadata {
  string file_name = 1;
  uint64 original_size = 2;
  uint32 chunk_size = 3;
  // Optional: 32-byte SHA-256 of original file. If empty, server won't validate.
  bytes sha256 = 4;
  // Max fraction of differing bytes allowed per chunk (0.0-1.0). 0 = use server default.
  // E.g. 0.40 means reject matches where >40% of bytes differ.
  float max_error_rate = 5;
  // Cluster-stored mode: when true, the CCF is stored on the cluster and only
  // a file_id is returned (instead of streaming the CCF bytes to the client).
  // The client can later call DecompressById to retrieve the original file.
  bool store_on_cluster = 10;
  // Preferred encoding version (e.g. "v6.0.0"). Empty = use server default.
  string preferred_encoding = 11;
}

message FileIdRequest {
  string file_id = 1;
}

message FileChunk {
  uint32 seq = 1;
  bytes data = 2;
  bool eof = 3;
}

message FileUploadRequest {
  oneof payload {
    FileMetadata metadata = 1;
    FileChunk chunk = 2;
  }
}

message CompressionStats {
  uint64 original_size = 1;
  uint64 compressed_size = 2;
  uint32 references_found = 3;
  uint32 total_chunks = 4;
  // 32-byte SHA-256 of compressed bytes.
  bytes compressed_sha256 = 5;
  // Actual bytes stored on agents for this file (new chunks only, no replication,
  // after zstd compression). This is the real datacenter storage cost.
  uint64 datacenter_bytes_stored = 6;
  // Pure server-side processing time in milliseconds (excludes network transfer).
  double server_processing_ms = 7;
  // Average error rate across reused chunks with diffs (0.0–1.0).
  float average_error_rate = 8;
  // Total bytes used by error correction payload in the CCF output.
  uint64 error_payload_bytes = 9;
  // Cluster-stored mode: the file ID (SHA256 hex) for later DecompressById calls.
  string file_id = 10;
}

message Error {
  string message = 1;
}

message DecompressionStats {
  uint64 compressed_size = 1;
  uint64 decompressed_size = 2;
  bytes decompressed_sha256 = 3;
}

message FileUploadResponse {
  oneof payload {
    CompressionStats stats = 1;
    FileChunk chunk = 2;
    Error error = 3;
    DecompressionStats decompress_stats = 4;
  }
}

message ClearCcfStoreRequest {}

message ClearCcfStoreResponse {
  bool success = 1;
  int64 bytes_freed = 2;
  int32 files_deleted = 3;
}

message CcfStoreStatsRequest {}

message CcfStoreStatsResponse {
  bool enabled = 1;
  bool optimizer_running = 2;
  int64 last_run_unix = 3;        // seconds since epoch, 0 = never
  int32 unpacked_count = 4;
  int64 unpacked_bytes = 5;
  int32 pack_count = 6;
  int64 pack_bytes = 7;
  int64 total_bytes = 8;          // unpacked + packed
  bool has_dictionary = 9;
  int64 dict_bytes = 10;
  int32 last_packed_count = 11;   // CCFs in last pack cycle
  int64 last_pack_saved_bytes = 12;
  int32 total_packed_all_time = 13;
  int64 pack_raw_bytes = 14;         // total inner payload bytes before zstd (across all packs)
  int64 pack_compressed_bytes = 15;  // total zstd-compressed bytes (across all packs)
  double pack_compression_ratio = 16; // 0.0-1.0, how much pack compression saves
  string encoding_version = 17;      // current CCF encoding version (e.g., "v5.3.0")
  int32 pframe_groups = 18;          // number of families (2+ CCFs sharing refs) found for P-frame delta
  int32 pframe_delta_count = 19;     // number of CCFs stored as P-frame deltas
  int64 pframe_saved_bytes = 20;     // inner payload bytes saved by P-frame delta encoding
  double pframe_saving_ratio = 21;   // P-frame savings as ratio of total inner payload
  int64 last_consolidation_saved_bytes = 22;   // bytes saved in the most recent consolidation cycle
  int64 total_consolidation_saved_bytes = 23;  // cumulative bytes saved by consolidation cycles
  int64 last_consolidation_unix = 24;          // seconds since epoch, 0 = never
  int32 last_consolidated_entries = 25;        // entries rewritten in most recent consolidation cycle
}