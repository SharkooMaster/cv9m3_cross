syntax = "proto3";

package gatewayService;

service GatewayService {
  rpc SearchAll(QueryRequest) returns (QueryResponse);
  rpc SearchAllStream(stream QueryObject) returns (stream QueryResponseObject);
}

message QueryRequest {
    repeated QueryObject queryObjects = 1;
    string HeadRouteID = 2;
}

message QueryObject
{
    int32 index = 1;
    repeated float vector = 2;
    string bucketString = 3;
    bytes chunk = 4;
}

message QueryResponse {
    repeated QueryResponseObject results = 1;
}

message QueryResponseObject
{
    uint64 bucket_id = 1;
    uint64 bucket_key = 2;
    float similarity = 3;
    bytes chunk = 4;
    int32 index = 5;
    bool duplicate = 6;
    bool need_to_store = 7; // OPTIMIZATION: Gateway indicates chunk needs storing (Cross will handle it)
    string target_agent = 8; // OPTIMIZATION: Which agent to store the chunk to (if need_to_store=true)
}
